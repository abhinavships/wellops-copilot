[project]
name = "wellops-evals"
version = "0.1.0"
description = "Evaluation system for the WellOps Asset Intelligence Copilot (Opik-centred)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "opik>=2.2.103",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "wellops",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
wellops = { path = "../backend", editable = true }
