# Golden A1: single-user questions Q1-Q10 (dataset/03-evaluation-queries.md). Expected values are the KEY, i.e. hypotheses:
# evals.truth.audit recomputes them from the substrate and reports agrees / disagrees_with_key / not_computable.
- id: Q01
  suite: golden
  title: Is WELL-0001 producing oil right now? (status card)
  source: dataset/03-evaluation-queries.md#Q1
  tags: [a1, status, notes, stale-status]
  turns:
    - user: U-201
      chat: chat-q01
      clock: "2026-10-17"
      say: "Is WELL-0001 producing oil right now? When was it last inspected, and by whom? Show me its status card."
      truth: {fn: well_status, args: {well: WELL-0001}}
      expect:
        ids_exact: [INS-0001-0203]
        numbers: [{label: delta_c, value: 3.2, tol: 0.05}]
        dates: ["2026-10-15"]
        text: [Ryan Brooks, Jake Morales, out of date]
        visual: [status_card]
        must_cite: [INS-0001-0203, CTX-0001-003]
        may_cite: [CTX-0001-002, WELL-0001]
