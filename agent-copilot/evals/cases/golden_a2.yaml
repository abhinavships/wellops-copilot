# Golden A2: memory + feedback from one user (Q11-Q14). Simulated clock per turn; new chat = new chat id.
- id: Q11
  suite: golden
  title: Remembering a past conversation (day 1 -> day 2, new chat)
  source: dataset/03-evaluation-queries.md#Q11
  tags: [a2, memory, multi-day]
  turns:
    - id: day1
      user: U-201
      chat: chat-q11-d1
      clock: "2026-10-17"
      say: "Which 3 wells in Northeast Block 7 had the most downtime in the last 4 months? Show a bar chart."
      truth: {fn: top_downtime, args: {area: Northeast Block 7, k: 3, since: "2026-06-16", until: "2026-10-16"}}
      expect:
        set_equals: [WELL-0121, WELL-0138, WELL-0107]
        visual: [bar]
    - id: day2
      user: U-201
      chat: chat-q11-d2
      clock: "2026-10-18"
      say: "For the three wells we discussed yesterday, what have repairs cost this year?"
      truth: {fn: repair_costs, args: {wells: [WELL-0121, WELL-0138, WELL-0107], year: 2026}}
      expect:
        set_equals: [WELL-0121, WELL-0138, WELL-0107]
        numbers:
          - {label: "usd:WELL-0121", value: 25794, tol: 0.5}
          - {label: "usd:WELL-0138", value: 46942, tol: 0.5}
          - {label: "usd:WELL-0107", value: 5176, tol: 0.5}
        visual: [table, bar]
        tools_any: [recall_episodes, repair_costs, sql]
- id: Q12
  suite: golden
  title: Correct wrong raw data (value correction), then re-ask Q2
  source: dataset/03-evaluation-queries.md#Q12
  tags: [a2, memory, overlay, conflict, correction]
  turns:
    - id: correct
      user: U-201
      chat: chat-q12
      clock: "2026-10-17"
      say: "The 15 Oct reading for WELL-0164 is wrong. The handheld thermal gun used in that inspection was faulty; the field crew re-measured the wellhead at 41.0 °C."
      truth:
        fn: well_status
        args: {well: WELL-0164}
        overlays: &ov_164
          - {kind: value_correction, scope_level: inspection, scope_key: INS-0164-0205, target_attr: wellhead_temp_c, value_num: 41.0, original_num: 24.0, author: U-201, reason: faulty thermal gun}
      expect:
        ids_exact: [INS-0164-0205]
        numbers: [{label: delta_c, value: 21.1, tol: 0.05}, {label: original_wellhead_c, value: 24.0, tol: 0.05}]
        text: [producing, Tyler Hughes, Pump jack not moving, confirm]
        must_disclose_overlay: Michael Turner
        must_flag_conflict: {required: true, keywords: [Pump jack not moving, Tyler Hughes]}
        visual: [correction_diff, status_card, conflict_card]
        must_cite: [INS-0164-0205]
        memory_write: {kind: value_correction, scope: inspection, key: INS-0164-0205, attr: wellhead_temp_c, original: 24.0, value: 41.0}
    - id: reask-q2
      user: U-201
      chat: chat-q12
      clock: "2026-10-17"
      say: "Which wells in Northeast Block 8 are not producing oil right now, and why? Show them in a table."
      truth: {fn: area_not_producing, args: {area: Northeast Block 8}, overlays: *ov_164}
      expect:
        set_equals: {ids: [WELL-0170, WELL-0172, WELL-0175], allowed_extra: [WELL-0164]}
        text: [WELL-0164, corrected]
        must_disclose_overlay: Michael Turner
        visual: [table]
        must_cite: [MNT-0170-031, MNT-0172-028]
- id: Q13
  suite: golden
  title: Correct the AI's analysis (spill volume), obligations recomputed
  source: dataset/03-evaluation-queries.md#Q13
  tags: [a2, memory, overlay, obligations]
  turns:
    - user: U-201
      chat: chat-q13
      clock: "2026-10-17"
      say: "The AI estimated the 24 Sep spill at WELL-0151 as 4.5 bbl. The field crew measured 5.4 bbl."
      truth:
        fn: spill_reassessment
        args: {inspection: INS-0151-0201}
        overlays: &ov_151
          - {kind: analysis_correction, scope_level: inspection, scope_key: INS-0151-0201, target_attr: spill_est_volume_bbl, value_num: 5.4, original_num: 4.5, author: U-201, reason: field crew measurement}
      expect:
        ids_exact: [INS-0151-0201, MNT-0151-025]
        numbers: [{label: volume_bbl, value: 5.4, tol: 0.05}, {label: containment_hours, value: 6.4, tol: 0.05}]
        dates: ["2026-11-23"]
        text: [reportable, SR-01, SR-02, SR-03, moderate, no written notice]
        must_disclose_overlay: Michael Turner
        visual: [correction_diff, obligation_timeline]
        must_cite: [INS-0151-0201, MNT-0151-025]
        memory_write: {kind: analysis_correction, scope: inspection, key: INS-0151-0201, attr: spill_est_volume_bbl, original: 4.5, value: 5.4}
- id: Q14
  suite: golden
  title: A rule for a whole well type (T350 RCA after 2 repairs), re-ask in a new chat
  source: dataset/03-evaluation-queries.md#Q14
  tags: [a2, memory, rule-override, scope]
  turns:
    - id: before
      user: U-201
      chat: chat-q14-a
      clock: "2026-10-17"
      say: "Which wells in Northeast Block 7 need a root-cause analysis on their pump jack?"
      truth: {fn: rca_candidates, args: {area: Northeast Block 7, equipment: pump_jack}}
      expect:
        set_equals: [WELL-0108, WELL-0121, WELL-0138]
        numbers: [{label: "repairs:WELL-0108", value: 3, tol: 0}, {label: "repairs:WELL-0121", value: 3, tol: 0}, {label: "repairs:WELL-0138", value: 3, tol: 0}]
        visual: [table]
        must_cite: [WELL-0108, WELL-0121, WELL-0138]
    - id: rule
      user: U-201
      chat: chat-q14-a
      clock: "2026-10-17"
      say: "Note for all T350 wells: our team now wants a pump jack root-cause analysis after 2 repairs, not 3."
      expect:
        text: [T350, after 2 repairs]
        memory_write: {kind: rule_override, scope: well_type, key: T350, attr: rca_corrective_count_min, original: 3, value: 2}
    - id: after
      user: U-201
      chat: chat-q14-b
      clock: "2026-10-17"
      say: "Which wells in Northeast Block 7 need a root-cause analysis on their pump jack?"
      truth:
        fn: rca_candidates
        args: {area: Northeast Block 7, equipment: pump_jack}
        overlays:
          - {kind: rule_override, scope_level: well_type, scope_key: T350, target_attr: rca_corrective_count_min, value_num: 2, original_num: 3, author: U-201, reason: team rule}
      expect:
        set_equals: [WELL-0108, WELL-0120, WELL-0121, WELL-0138]
        text: [Michael Turner, rule, T350]
        must_disclose_overlay: Michael Turner
        visual: [table]
        must_cite: [WELL-0120]
