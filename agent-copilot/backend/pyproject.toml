[project]
name = "wellops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "logfire>=5.2.0",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[ag-ui,openai,openrouter]>=2.57.0",
    "pydantic-settings>=2.16.0",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
